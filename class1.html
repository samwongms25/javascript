<!DOCTYPE html>
<html>
<body>

  <p class="greeting">Hello World</p>
  <p class="greeting">Welcome to JavaScript</p>
  <span class="greeting">Have a great day!</span>

  <script>
    // 1. Select all elements with the class 'greeting'
    const items = document.getElementsByClassName("greeting");

    // 2. Access the first element and change its text color to red
    items[0].style.color = "red";
    items[1].style.fontSize = "80px";
    items[2].style.marginLeft = "100px";
    items[2].style.color = "blue";
  </script>

</body>
</html>
