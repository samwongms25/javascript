<!DOCTYPE html>
<html>
<head>
<title>React! React! React!</title>
<script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>
<script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js"></script>
<style>
#r {
padding: 50px;
background-color: #fff;
}

</style>
</head>
<body>
<div id="r"></div>
<script type="text/babel">
    var Square = React.createClass({
        render: function() {
            var squareStyle = {
                height: 100,
                backgroundColor: '#ff6663',
            }
            return (
                <div style={squareStyle}>
                    </div>
            );
        }
    });

    var Square2 = React.createClass({
        render: function() {
            var square2Style = {
                height: 50,
                backgroundColor: '#206663',
            }
            return (
                <div style={square2Style}>
                    </div>
            );
        }
    });

    var Label = React.createClass({
        render: function() {
            var labelStyle = {
                fontWeight: 'bold',
                fontFamily: 'Sans-serif',
                padding: 10,
                textAlign: 'center',
                marginTop: 5
            }
            
            return (
                <p style={labelStyle}>Card's background color</p>
            );
        }
    });


    

    var Card = React.createClass({
        render: function() {
            var cardStyle = {
                height: 200,
                width: 400,
                backgroundColor: '#f0f',
                padding: 0,
                WebkitFilter: "drop-shadow(0px 12px 15px #f66)",
                filter: "drop-shadow(0px 2px 15px #f66)"
            }
            
            return (
                <div style={cardStyle}>
                    <Square/>
                    <Square2/>
                    <Label/>
                    
                </div>
            );
        }
    });


    ReactDOM.render(
        <div>
            <Card/>
        </div>,
        document.querySelector('#r')
    );
</script>
</body>
</html>
